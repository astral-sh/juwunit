name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Perform a dry run
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  CI:
    uses: $/.github/workflows/CI.yml
    with:
      release_build: true
    permissions:
      contents: read

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: ci
    permissions:
      id-token: write # Used for Trusted Publishing + to sign the release artifacts
      contents: write # Used to upload release artifacts
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
      - name: Verify downloaded artifacts
        run: |
          artifacts="$(find . -path './wheels-*/*' -type f | sort)"
          if [ -z "${artifacts}" ]; then
            echo "No build artifacts were downloaded." >&2
            exit 1
          fi
          printf '%s\n' "${artifacts}"
      - name: Confirm dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Dry run completed after validating the CI artifact handoff."
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Generate attestations
        if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
        with:
          paths: |
            wheels-*/*
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: uv publish 'wheels-*/*'


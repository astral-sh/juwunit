name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Perform a dry run
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  CI:
    uses: ./.github/workflows/CI.yml
    with:
      release_build: true
    permissions:
      contents: read

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: ci
    permissions:
      id-token: write # Used for Trusted Publishing + to sign the release artifacts
      contents: write # Used to upload release artifacts
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
      - name: Verify downloaded artifacts
        run: |
          artifacts="$(find . -path './wheels-*/*' -type f | sort)"
          if [ -z "${artifacts}" ]; then
            echo "No build artifacts were downloaded." >&2
            exit 1
          fi
          printf '%s\n' "${artifacts}"
      - name: Confirm dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Dry run completed after validating the CI artifact handoff."
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Generate attestations
        if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: |
            wheels-*/*
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
        run: uv publish 'wheels-*/*'

